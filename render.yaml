services:
  - type: web
    name: insightedge-express-backend
    env: node
    buildCommand: npm install
    startCommand: npm run server
    envVars:
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: insightedge-career-api
    env: python
    buildCommand: pip install -r career_api/requirements.txt
    startCommand: cd career_api && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
